<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES Marathon: 101 игра</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --text-color: #f0f0f0;
            --card-bg: #2d2d2d;
            --accent-color: #ff4757;
            --status-completed: #2ed573;
            --status-playing: #ffa502;
            --status-planned: #747d8c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #a4b0be;
            margin-bottom: 30px;
            text-align: center;
        }

        .filters {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 2px solid #57606f;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .table-container {
            width: 100%;
            max-width: 1000px;
            overflow-x: auto;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid #3f4448;
        }

        th {
            background-color: #222;
            color: var(--accent-color);
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:hover {
            background-color: #383838;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status.completed { background-color: var(--status-completed); color: #000; }
        .status.playing { background-color: var(--status-playing); color: #000; }
        .status.planned { background-color: var(--status-planned); color: #fff; }

        .rating {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>NES Marathon: 101 Games Challenge</h1>
    <p class="subtitle">Мой челлендж по прохождению игр для Nintendo Entertainment System в стиле The Mexican Runner</p>

    <div class="filters">
        <button class="filter-btn active" onclick="filterGames('all')">Все</button>
        <button class="filter-btn" onclick="filterGames('пройдена')">Пройдено</button>
        <button class="filter-btn" onclick="filterGames('в процессе')">В процессе</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Название игры</th>
                    <th>Статус</th>
                    <th>Рейтинг</th>
                    <th>Дата прохождения</th>
                </tr>
            </thead>
            <tbody id="games-list">
                <!-- Данные загрузятся из JSON -->
            </tbody>
        </table>
    </div>

    <script>
        let allGames = [];

        async function loadGames() {
            try {
                // Добавили случайный параметр к имени файла, чтобы гитхаб не кэшировал старую версию JSON
                const response = await fetch('games.json?v=' + Date.now());
                allGames = await response.json();
                renderGames(allGames);
            } catch (error) {
                console.error("Ошибка загрузки:", error);
                document.getElementById('games-list').innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">Ошибка загрузки файла games.json</td></tr>`;
            }
        }

        function renderGames(games) {
            const tbody = document.getElementById('games-list');
            tbody.innerHTML = '';

            games.forEach((game, index) => {
                // Точно сопоставляем ключи из твоего файла
                const title = game.name || "Без названия";
                const status = game.status ? game.status.toLowerCase().trim() : "не пройдена";
                const rating = game.rating ? game.rating.trim() : "-";
                const date = game.date ? game.date.trim() : "-";

                let statusText = "Не пройдена";
                let statusClass = "planned";

                if (status === "пройдена" || status === "пройдено") {
                    statusText = "Пройдено";
                    statusClass = "completed";
                } else if (status === "в процессе") {
                    statusText = "В процессе";
                    statusClass = "playing";
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="font-weight: bold; color: #fff;">${title}</td>
                    <td><span class="status ${statusClass}">${statusText}</span></td>
                    <td class="rating">${(rating !== "-" && rating !== "") ? rating + ' / 10' : '—'}</td>
                    <td>${(date !== "-" && date !== "") ? date : '—'}</td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterGames(statusFilter) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (statusFilter === 'all') {
                renderGames(allGames);
            } else {
                const filtered = allGames.filter(game => {
                    const gameStatus = game.status ? game.status.toLowerCase().trim() : "не пройдена";
                    return gameStatus === statusFilter;
                });
                renderGames(filtered);
            }
        }

        window.onload = loadGames;
    </script>
</body>
</html>
